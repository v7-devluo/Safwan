<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفوان .</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        :root {
            --telegram-blue:#007aff;
            --page-bg-light:#e0f2f7;
            --page-bg-dark:#030305;
            --ui-bg:#fff;
            --text-primary:#000;
            --text-secondary:#6d6d72;
            --divider:#e5e5ea
        }

        body.dark-mode{
            --ui-bg:#212d3b;
            --text-primary:#fff;
            --text-secondary:#8ea1b7;
            --divider:#2c3a48
        }

        body{
            font-family:'Roboto',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
            background-color:var(--page-bg-dark);
            background-image:url(https://i.pinimg.com/originals/85/ec/df/85ecdf1c3642145b063b75da58694433.jpg);
            background-attachment:fixed;
            background-size:cover;
            background-position:center;
            color:var(--text-primary);
            display:flex;
            justify-content:center;
            align-items:flex-start;
            min-height:100vh;
            margin:0;
            padding:40px 20px;
            transition:background-color .3s ease;
            user-select:none
        }

        body:not(.dark-mode){
            background-color:var(--page-bg-light);
            background-image:none
        }

        .iphone-frame{
            width:100%;
            max-width:420px;
            background-color:var(--ui-bg);
            border-radius:40px;
            border:1px solid rgba(0,243,255,0.4);
            overflow:hidden;
            position:relative;
            transition:background-color .3s ease;
        }

        .theme-toggle{
            position:absolute;
            top:20px;
            left:20px;
            width:40px;
            height:40px;
            background-color:rgba(128,128,128,.2);
            border-radius:50%;
            display:flex;
            justify-content:center;
            align-items:center;
            cursor:pointer;
            font-size:20px;
            color:var(--text-secondary);
            z-index:10;
            backdrop-filter:blur(5px);
            border:1px solid rgba(128,128,128,.1)
        }

        .theme-toggle .bi-sun-fill{display:none}
        .dark-mode .theme-toggle .bi-sun-fill{display:inline-block}
        .dark-mode .theme-toggle .bi-moon-stars-fill{display:none}

        .profile-content{
            padding:15px;
            margin:0 15px 15px;
            border-radius:12px;
            margin-top:60px
        }

        .profile-header{
            text-align:center;
            padding:10px 0;
            position:relative;
        }

        .avatar-wrap{
            position:relative;
            width:100px;
            height:100px;
            margin:0 auto 15px;
        }

        .profile-pic{
            position:relative;
            z-index:1;
            width:100%;
            height:100%;
            border-radius:50%;
            object-fit:cover;
        }

        .avatar-wrap::before {
            content:'';
            position:absolute;
            inset:-4px;
            border-radius:50%;
            border:2px solid transparent;
            border-top-color:red;
            border-bottom-color:#bc13fe;
            animation:spin 5s linear infinite;
        }

        @keyframes spin {
            from {
                transform:rotate(0deg);
            }

            to {
                transform:rotate(360deg);
            }
        }

        .name-container{
            display:flex;
            justify-content:center;
            align-items:center;
            gap:8px;
            flex-direction:row-reverse;
        }

        .name{
            font-size:24px;
            font-weight:700;
            color:var(--text-primary)
        }

        /* Instagram Verification Badge */

        .verified-badge{
            width:22px;
            height:22px;
            background:#0095f6;
            border-radius:50%;
            display:flex;
            justify-content:center;
            align-items:center;
            position:relative;
        }

        .verified-badge::before{
            content:'';
            width:9px;
            height:5px;
            border-left:2px solid white;
            border-bottom:2px solid white;
            transform:rotate(-45deg);
            margin-top:-2px;
        }

        .status{
            font-size:15px;
            color:var(--telegram-blue);
            margin-top:4px
        }

        /* Instagram */

        .instagram-box{
            display:flex;
            align-items:center;
            justify-content:center;
            gap:12px;
            width:100%;
            box-sizing:border-box;
            padding:15px;
            margin:20px 0 10px;
            border-radius:12px;
            text-decoration:none;
            color:var(--text-primary);
            background-color:var(--ui-bg);
            border:1px solid var(--divider);
            transition:transform .2s ease, border-color .2s ease;
        }

        .instagram-box:hover{
            transform:translateY(-2px);
            border-color:#ff2fa6;
        }

        .instagram-box i{
            font-size:25px;
            color:#ff2fa6;
        }

        .instagram-box span{
            font-size:15px;
            font-weight:500;
        }

        .info-item{
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:14px 16px
        }

        .value.black{
            color:var(--text-primary)
        }

        .icon{
            font-size:24px;
            color:var(--telegram-blue)
        }

        /* About Me Title */

        .about-title{
            width:max-content;
            max-width:90%;
            margin:18px auto 16px;
            padding:7px 14px;
            text-align:center;
            font-size:16px;
            font-weight:500;
            color:var(--text-primary);
            border:1px solid var(--divider);
            border-radius:8px;
            background:rgba(128,128,128,0.05);
        }

        .notification-item{
            display:flex;
            align-items:center;
            gap:15px;
            background-color:var(--ui-bg);
            padding:15px;
            border-radius:10px;
            text-decoration:none;
            border:1px solid var(--divider);
            color:var(--text-primary);
            margin-bottom:10px
        }

        .notification-item i{
            font-size:24px;
            color:var(--telegram-blue)
        }

        /* My Gallery Title */

        .gallery-title{
            width:max-content;
            max-width:90%;
            margin:22px auto 14px;
            padding:7px 14px;
            text-align:center;
            font-size:16px;
            font-weight:500;
            color:var(--text-primary);
            border:1px solid var(--divider);
            border-radius:8px;
            background:rgba(128,128,128,0.05);
        }

        /* Gallery */

        .gallery{
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:10px;
            margin:0 0 10px;
        }

        .gallery-item{
            width:100%;
            aspect-ratio:1/1;
            border-radius:12px;
            overflow:hidden;
            border:1px solid var(--divider);
            background:rgba(128,128,128,0.06);
            cursor:pointer;
            transition:transform .2s ease, border-color .2s ease;
        }

        .gallery-item:hover{
            transform:translateY(-2px);
            border-color:#bc13fe;
        }

        .gallery-item img{
            width:100%;
            height:100%;
            object-fit:cover;
            display:block;
        }

        /* Gallery Image Viewer */

        .gallery-viewer{
            position:fixed;
            inset:0;
            background:rgba(0,0,0,.82);
            backdrop-filter:blur(6px);
            display:none;
            justify-content:center;
            align-items:center;
            z-index:9999;
            padding:20px;
            box-sizing:border-box;
        }

        .gallery-viewer.active{
            display:flex;
        }

        .gallery-viewer img{
            max-width:95%;
            max-height:85vh;
            object-fit:contain;
            border-radius:15px;
            border:1px solid rgba(255,255,255,.25);
            box-shadow:0 0 30px rgba(0,0,0,.5);
        }

        .gallery-close{
            position:absolute;
            top:20px;
            right:22px;
            width:42px;
            height:42px;
            border-radius:50%;
            border:1px solid rgba(255,255,255,.2);
            background:rgba(255,255,255,.1);
            color:white;
            font-size:25px;
            display:flex;
            align-items:center;
            justify-content:center;
            cursor:pointer;
        }

        .bg-grad {
            position:fixed;
            inset:0;
            background:
                linear-gradient(
                    transparent 95%,
                    rgba(0,243,255,0.2) 96%,
                    rgba(0,243,255,0.6) 100%
                ),
                linear-gradient(
                    90deg,
                    transparent 95%,
                    rgba(188,19,254,0.2) 96%,
                    rgba(188,19,254,0.6) 100%
                );
            background-size:40px 40px;
            perspective:500px;
            transform-style:preserve-3d;
            animation:gridMove 20s linear infinite;
            z-index:-2;
            opacity:0.4;
        }

    </style>

</head>

<body class="dark-mode">

<div class="bg-grad"></div>

<div class="iphone-frame">

    <div id="theme-toggle" class="theme-toggle">
        <i class="bi bi-moon-stars-fill"></i>
        <i class="bi bi-sun-fill"></i>
    </div>

    <div class="profile-content">

        <div class="profile-header">

            <div class="avatar-wrap">

                <img src="https://e.top4top.io/p_3872t72la1.jpg"
                     class="profile-pic">

            </div>

            <div class="name-container">

                <span class="name">. صفوان</span>

                <span class="verified-badge"></span>

            </div>

            <p class="status">
                ما چانت النيّة حبّ بس والله روحك حلوة
            </p>

        </div>


        <!-- Instagram -->

        <a href="https://instagram.com/c_v.m"
           target="_blank"
           rel="noopener noreferrer"
           class="instagram-box">

            <i class="bi bi-instagram"></i>

            <span>𝑴𝒚 𝑰𝒏𝒔𝒕𝒂𝒈𝒓𝒂𝒎 𝒂𝒄𝒄𝒐𝒖𝒏𝒕</span>

        </a>


        <div class="info-item">

            <div>

                <div class="value black">
                    2006/6/2
                </div>

                <div style="font-size:13px;color:var(--text-secondary)">
                    Birthday
                </div>

            </div>

            <i class="bi bi-gift-fill icon"></i>

        </div>


        <!-- About Me -->

        <div class="about-title">
            A little about me ♡
        </div>


        <div id="notifications" class="tab-content active">

            <div class="notification-item">

                <i class="bi bi-bell-fill"></i>

                <span>
                    🩷. أَلا بِـذِكـرِ اللّٰـِهَّ تَطمَئـِنُّ القُلـوبُ
                </span>

            </div>


            <div class="notification-item">

                <i class="bi bi-bell-fill"></i>

                <span>
                    اهجرو القلوب التي ليست ملككم
                </span>

            </div>


            <div class="notification-item">

                <i class="bi bi-bell-fill"></i>

                <span>
                    💜. -حَـاشَـاه ان يخذلك
                </span>

            </div>

        </div>


        <!-- My Gallery -->

        <div class="gallery-title">
            My Gallery ♡
        </div>


        <div class="gallery">

            <!-- الصورة الأولى: غيّر الرابط هنا -->

            <div class="gallery-item"
                 onclick="openGallery(this)">

                <img src="https://j.top4top.io/p_3872q8tdb1.jpg"
                     alt="Gallery Image 1">

            </div>


            <!-- الصورة الثانية: غيّر الرابط هنا -->

            <div class="gallery-item"
                 onclick="openGallery(this)">

                <img src="https://k.top4top.io/p_3872k0cbm1.jpg"
                     alt="Gallery Image 2">

            </div>

        </div>

    </div>

</div>


<!-- Gallery Viewer -->

<div id="gallery-viewer"
     class="gallery-viewer"
     onclick="closeGallery(event)">

    <button class="gallery-close"
            onclick="closeGallery(event)">
        ×
    </button>

    <img id="gallery-viewer-img"
         src=""
         alt="Gallery Preview">

</div>


<script>

const themeToggle = document.getElementById('theme-toggle');
const body = document.body;

if(localStorage.getItem('theme') === 'light'){
    body.classList.remove('dark-mode');
}

themeToggle.onclick = () => {

    body.classList.toggle('dark-mode');

    localStorage.setItem(
        'theme',
        body.classList.contains('dark-mode')
            ? 'dark'
            : 'light'
    );

};


/* Gallery */

function openGallery(item){

    const image = item.querySelector('img');

    const viewer = document.getElementById('gallery-viewer');

    const viewerImage = document.getElementById('gallery-viewer-img');

    viewerImage.src = image.src;

    viewer.classList.add('active');

}


function closeGallery(event){

    if(
        event.target.id === 'gallery-viewer' ||
        event.target.classList.contains('gallery-close')
    ){

        document
            .getElementById('gallery-viewer')
            .classList.remove('active');

    }

}


/* ESC لإغلاق الصورة */

document.addEventListener('keydown', function(event){

    if(event.key === 'Escape'){

        document
            .getElementById('gallery-viewer')
            .classList.remove('active');

    }

});

</script>

</body>
</html>
